version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: ses-sender-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ses_sender_root_123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ses_sender}
      - MYSQL_USER=${MYSQL_USER:-ses_sender}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ses_sender_123}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: ses-sender-backend
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-ses_sender}:${MYSQL_PASSWORD:-ses_sender_123}@mysql:3306/${MYSQL_DATABASE:-ses_sender}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ses-sender-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
